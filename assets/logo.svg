<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Oh My Pi plus Nix</title>
  <desc id="desc">The Oh My Pi mark and the blue Nix snowflake, separated by a neutral plus sign on a transparent background.</desc>

  <!-- Oh My Pi web app mark: can1357/oh-my-pi, MIT.
       Source: https://github.com/can1357/oh-my-pi/blob/main/packages/collab-web/public/favicon.svg
       Original geometry and colors retained; resized and positioned for this lockup. -->
  <svg x="60" y="40" width="160" height="160" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="omp-mark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ed4abf"/>
        <stop offset=".5" stop-color="#9b4dff"/>
        <stop offset="1" stop-color="#5ad8e6"/>
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="12" fill="#0f0a14"/>
    <path fill="url(#omp-mark)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z"/>
  </svg>

  <!-- Neutral separator. -->
  <path d="M304 120h32m-16-16v32" fill="none" stroke="#8b949e" stroke-width="6" stroke-linecap="round"/>

  <!-- Nix snowflake: Simon Frankau and Tim Cuthbertson, CC BY 4.0.
       Source: https://github.com/NixOS/nixos-artwork/blob/master/logo/nix-snowflake-colours.svg
       Original geometry and colors retained; resized and positioned for this lockup. -->
  <svg x="400" y="20" width="200" height="200" viewBox="0 0 501.56251 501.56249" aria-hidden="true">
    <defs>
      <linearGradient id="nix-light" gradientUnits="userSpaceOnUse" gradientTransform="translate(70.650339,-1055.1511)" x1="200.59668" y1="351.41116" x2="290.08701" y2="506.18814">
        <stop offset="0" stop-color="#699ad7"/>
        <stop offset="0.24345198" stop-color="#7eb1dd"/>
        <stop offset="1" stop-color="#7ebae4"/>
      </linearGradient>
      <linearGradient id="nix-dark" gradientUnits="userSpaceOnUse" gradientTransform="translate(864.69589,-1491.3405)" x1="-584.19934" y1="782.33563" x2="-496.29703" y2="937.71399">
        <stop offset="0" stop-color="#415e9a"/>
        <stop offset="0.23168644" stop-color="#4a6baf"/>
        <stop offset="1" stop-color="#5277c3"/>
      </linearGradient>
    </defs>
    <g transform="translate(-156.41121,933.30685)">
      <g transform="matrix(0.99994059,0,0,0.99994059,-0.06321798,33.188377)" fill-rule="evenodd">
        <path id="nix-light-arm" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8257 z" fill="url(#nix-light)"/>
        <use xlink:href="#nix-light-arm" transform="rotate(60,407.11155,-715.78724)"/>
        <use xlink:href="#nix-light-arm" transform="rotate(-60,407.31177,-715.70016)"/>
        <use xlink:href="#nix-light-arm" transform="rotate(180,407.41868,-715.7565)"/>
        <path id="nix-dark-arm" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8256 z" fill="url(#nix-dark)"/>
        <use xlink:href="#nix-dark-arm" transform="rotate(120,407.33916,-716.08356)"/>
        <use xlink:href="#nix-dark-arm" transform="rotate(-120,407.28823,-715.86995)"/>
      </g>
    </g>
  </svg>
</svg>
